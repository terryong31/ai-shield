# Toolchain pins and the task runner for the whole monorepo.
# `mise tasks` lists everything; `mise run check` is the pre-push gate.

[tools]
node = "24.20.0"
bun = "1.4.0"
uv = "0.12.13"
python = "3.12"
supabase = "2.116.0"
infisical = "0.44.11"
lefthook = "2.2.2"
gitleaks = "8.30.1"
actionlint = "1.7.12"
zizmor = "1.33.1"
shellcheck = "0.11.0"
semgrep = "1.186.0"

[env]
UV_PYTHON = "3.12"

# --- setup -------------------------------------------------------------------

[tasks.setup]
description = "Install tools, all Python and JavaScript dependencies, and the git hooks"
run = ["mise install", "uv sync --all-packages", "bun install", "lefthook install"]

[tasks."hooks:install"]
description = "Install the lefthook git hooks (pre-commit, commit-msg, pre-push)"
run = "lefthook install"

# --- dev servers ---------------------------------------------------------------

[tasks."docker:ensure"]
description = "Ensure the Docker daemon is running (starts OrbStack if installed and stopped)"
run = "docker info >/dev/null 2>&1 || (command -v orbctl >/dev/null 2>&1 && orbctl start && docker info >/dev/null 2>&1) || { echo 'Docker is not running. Start OrbStack or Docker Desktop first.' >&2; exit 1; }"

[tasks."infra:up"]
description = "Ensure Docker, local Supabase, and Redis are running"
depends = ["docker:ensure"]
run = [
  "supabase status >/dev/null 2>&1 || supabase start",
  "docker compose up -d redis --wait",
]

[tasks."api:dev"]
description = "Run the gateway API with reload on :8000 (Infisical dev /api + local Supabase)"
dir = "apps/api"
env = { APP_ENV = "development" }
depends = ["infra:up"]
run = "infisical run --env=dev --path=/api -- python3 ../../scripts/local_env.py -- uv run uvicorn shield_api.main:app --reload --reload-include '*.py' --reload-include .env --port 8000 --timeout-graceful-shutdown 1"

[tasks."web:dev"]
description = "Run the Nuxt web client on :3000 (Infisical dev /web)"
dir = "apps/web"
run = "infisical run --env=dev --path=/web -- bun run dev"

[tasks.dev]
description = "Run API and web together"
depends = ["api:dev", "web:dev"]

[tasks.stop]
description = "Stop this repo's dev servers, Stripe listener, Redis and local Supabase (data is kept)"
run = '''
#!/usr/bin/env bash
set -u
# Only processes whose working directory is in this repo: other projects keep running.
find_pids() {
  {
    lsof -nP -t -iTCP:3000 -iTCP:8000 -sTCP:LISTEN
    pgrep -f 'mise (run )?(dev|api:dev|web:dev|stripe:listen)|uvicorn shield_api|nuxt.* dev|bun run dev|stripe listen|infisical run'
  } 2>/dev/null | sort -u | while read -r pid; do
    [ "$pid" = "$$" ] || [ "$pid" = "$PPID" ] && continue
    cwd=$(lsof -a -p "$pid" -d cwd -Fn 2>/dev/null | sed -n 's/^n//p')
    case "$cwd" in
      "$MISE_PROJECT_ROOT"|"$MISE_PROJECT_ROOT"/apps/*) echo "$pid" ;;
    esac
  done
}
pids=$(find_pids)
if [ -n "$pids" ]; then
  kill -INT $pids 2>/dev/null
  for _ in 1 2 3 4 5 6 7 8; do
    sleep 1
    [ -z "$(find_pids)" ] && break
  done
  left=$(find_pids)
  [ -n "$left" ] && kill -KILL $left 2>/dev/null
fi
docker compose stop
supabase stop
echo "Stopped."
'''

[tasks."stripe:setup"]
description = "Store Stripe sandbox keys in Infisical dev and prod: mise run stripe:setup https://<web URL>"
run = "python3 scripts/stripe_setup.py"

[tasks."stripe:events"]
description = "Update the events of the production webhook: mise run stripe:events https://<web URL>"
run = "infisical run --env=prod --path=/api -- python3 scripts/stripe_setup.py ${usage_url} --events"
usage = 'arg "<url>"'

[tasks."stripe:listen"]
description = "Forward Stripe sandbox events to the local API"
run = "infisical run --env=dev --path=/api -- sh -c 'STRIPE_API_KEY=$STRIPE_SECRET_KEY exec stripe listen --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired,charge.refunded,refund.failed,refund.updated,charge.dispute.funds_withdrawn,charge.dispute.funds_reinstated --forward-to localhost:8000/api/v1/billing/webhook'"

# --- tests ---------------------------------------------------------------------

[tasks."test:engine"]
description = "Engine unit tests with coverage (fails under 90%)"
run = "uv run pytest packages/engine --cov=shield_engine --cov-fail-under=90"

[tasks."test:api"]
description = "Gateway tests with coverage (fails under 85%)"
run = "uv run pytest apps/api --cov=shield_api --cov-fail-under=85"

[tasks."test:tooling"]
description = "Tests for repo tooling (SDD workflow, spec checker)"
run = "uv run pytest scripts/tests"

[tasks."test:web"]
description = "Web unit tests (Vitest)"
dir = "apps/web"
run = "bun run test"

[tasks."test:e2e"]
description = "Playwright tests against the local stack (mise run dev) or E2E_BASE_URL"
dir = "apps/web"
run = "bunx playwright test"

[tasks.test]
description = "All tests"
depends = ["test:engine", "test:api", "test:tooling", "test:web"]

# --- static checks -------------------------------------------------------------

[tasks."lint:py"]
description = "Ruff lint + format check"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks."lint:web"]
description = "ESLint"
dir = "apps/web"
run = "bun run lint"

[tasks."lint:actions"]
description = "actionlint + zizmor over the GitHub Actions workflows"
run = ["actionlint", "zizmor --offline --min-severity medium .github"]

[tasks.lint]
description = "All linters"
depends = ["lint:py", "lint:web", "lint:actions"]

[tasks."secrets:scan"]
description = "gitleaks over the full git history"
run = "gitleaks git --redact --no-banner"

[tasks.sast]
description = "Semgrep SAST over Python, TypeScript/Vue, and Dockerfiles"
run = "semgrep scan --error --metrics=off --config p/python --config p/typescript --config p/dockerfile --config p/owasp-top-ten ."

[tasks."typecheck:py"]
description = "mypy --strict over engine and API"
run = "uv run mypy"

[tasks."typecheck:web"]
description = "vue-tsc via nuxt typecheck"
dir = "apps/web"
run = "bun run typecheck"

[tasks.typecheck]
description = "All type checkers"
depends = ["typecheck:py", "typecheck:web"]

[tasks.format]
description = "Auto-format everything"
run = ["uv run ruff format .", "uv run ruff check --fix .", "bun run --cwd apps/web lint:fix"]

# --- contracts & specs -----------------------------------------------------------

[tasks.contract]
description = "Regenerate the OpenAPI contract and the web client's types from it"
run = ["uv run shield-api-export-openapi", "bun run --cwd apps/web contract"]

[tasks."contract:check"]
description = "Fail if the committed contract or generated types are stale"
run = [
  "uv run shield-api-export-openapi",
  "bun run --cwd apps/web contract",
  "git diff --exit-code -- contracts apps/web/app/types/api.gen.ts",
]

[tasks."spec:check"]
description = "Every acceptance criterion in accepted specs has a test"
run = "uv run python scripts/check_spec_coverage.py"

# --- enforced SDD + TDD cycle (spec 0010) ----------------------------------------
# spec ─▶ red ─▶ green ─▶ verified ─▶ done. Each step checks evidence; see AGENTS.md.

[tasks."sdd:start"]
description = "Start a cycle: sdd:start <spec> [IDs…]  |  sdd:start --refactor \"reason\""
run = "python3 scripts/sdd.py start"

[tasks."sdd:red"]
description = "Run the target criteria's tests; advance only if every criterion has a failing test"
run = "python3 scripts/sdd.py red"

[tasks."sdd:green"]
description = "Run the target criteria's tests; advance only if all pass"
run = "python3 scripts/sdd.py green"

[tasks."sdd:verify"]
description = "Run the full gate (mise run check); advance only if it passes"
run = "python3 scripts/sdd.py verify"

[tasks."sdd:done"]
description = "Close the cycle: mark the spec Implemented and record the verification"
run = "python3 scripts/sdd.py done"

[tasks."sdd:status"]
description = "Show the active cycle and the next required step"
run = "python3 scripts/sdd.py status"

[tasks."sdd:abort"]
description = "Discard the active cycle (nothing is recorded)"
run = "python3 scripts/sdd.py abort"

[tasks."spec:new"]
description = "Scaffold a new spec folder: mise run spec:new <slug>"
run = "uv run python scripts/new_spec.py"

# --- database (Supabase CLI; needs Docker) ----------------------------------------

[tasks."admin:create"]
description = "Create or promote a local Supabase user to admin (app_metadata.role = admin); prompts for the password"
dir = "apps/api"
depends = ["db:start"]
usage = 'arg "<email>" help="The admin account email"'
run = 'python3 ../../scripts/local_env.py -- uv run python -m shield_api.admin_cli create "${usage_email}"'

[tasks."admin:revoke"]
description = "Remove the admin role from a local Supabase user"
dir = "apps/api"
depends = ["db:start"]
usage = 'arg "<email>" help="The admin account email"'
run = 'python3 ../../scripts/local_env.py -- uv run python -m shield_api.admin_cli revoke "${usage_email}"'

[tasks."admin:remote:create"]
description = "Create or promote a Cloud Supabase user to admin (uses Infisical prod /api)"
dir = "apps/api"
usage = 'arg "<email>" help="The admin account email"'
run = 'infisical run --env=prod --path=/api -- uv run python -m shield_api.admin_cli create "${usage_email}"'

[tasks."admin:remote:revoke"]
description = "Remove the admin role from a Cloud Supabase user (uses Infisical prod /api)"
dir = "apps/api"
usage = 'arg "<email>" help="The admin account email"'
run = 'infisical run --env=prod --path=/api -- uv run python -m shield_api.admin_cli revoke "${usage_email}"'

[tasks."db:start"]
description = "Start the local Supabase stack (applies migrations + seed on first run)"
depends = ["docker:ensure"]
run = "supabase status >/dev/null 2>&1 || supabase start"

[tasks."db:stop"]
description = "Stop the local Supabase stack (data is kept)"
run = "supabase stop"

[tasks."redis:start"]
description = "Start the local Redis container on :6379 for leaderboard caching"
run = "docker compose up -d redis --wait"

[tasks."redis:stop"]
description = "Stop the local Redis container"
run = "docker compose stop redis"

[tasks."db:status"]
description = "Show local URLs and keys (API URL + service_role key go in apps/api/.env)"
run = "supabase status"

[tasks.mailpit]
description = "Open the local Mailpit web UI (:54424) where all local Supabase auth emails land"
depends = ["db:start"]
run = "echo 'Mailpit UI: http://127.0.0.1:54424  (SMTP: 127.0.0.1:54425)' && (open http://127.0.0.1:54424 2>/dev/null || xdg-open http://127.0.0.1:54424 2>/dev/null || true)"

[tasks."db:env"]
description = "Print SUPABASE_URL / SUPABASE_KEY lines for apps/api/.env from the local stack"
run = "supabase status -o json | python3 -c \"import json,sys; s=json.load(sys.stdin); print('SUPABASE_URL=' + s['API_URL']); print('SUPABASE_KEY=' + (s.get('SERVICE_ROLE_KEY') or s['SECRET_KEY']))\""

[tasks."db:up"]
description = "Apply pending migrations to the local database without wiping data"
run = "supabase migration up"

[tasks."db:reset"]
description = "Recreate the local database from migrations, then run supabase/seed.sql"
run = "supabase db reset"

[tasks."db:migration"]
description = "Create a new migration: mise run db:migration <name>"
run = "supabase migration new"

[tasks."db:diff"]
description = "Generate SQL for schema changes made in Studio: mise run db:diff -f <name>"
run = "supabase db diff --schema audit,game,players"

[tasks."db:check"]
description = "CI: apply every migration to a fresh database, then fail on plpgsql errors"
run = [
  "supabase db start",
  "supabase db lint --local --schema audit,game,players --fail-on error",
]

[tasks."db:lint"]
description = "Lint the local database schema"
run = "supabase db lint --local --schema audit,game,players"

[tasks."db:link"]
description = "Link this repo to a hosted project: mise run db:link --project-ref <ref>"
run = "supabase link"

[tasks."db:remote:status"]
description = "Compare local vs. linked Cloud Supabase migration history (read-only)"
run = "supabase migration list"

[tasks."db:remote:plan"]
description = "Preview pending migrations against the linked Cloud Supabase project (dry run)"
run = "supabase db push --dry-run"

[tasks."db:remote:push"]
description = "Apply pending migrations to the linked Cloud Supabase project (never runs seed)"
run = "supabase db push"

[tasks."db:push"]
description = "Alias for db:remote:push (applies pending migrations to the linked Cloud project)"
run = "supabase db push"

# --- docker ------------------------------------------------------------------------

[tasks.up]
description = "Build and run API + web with Docker Compose (Infisical dev /api + local Supabase)"
depends = ["db:start"]
run = "infisical run --env=dev --path=/api -- python3 scripts/local_env.py --docker -- docker compose up --build"

[tasks.down]
description = "Stop the Compose stack"
run = "docker compose down"

# --- model ----------------------------------------------------------------------

[tasks.train]
description = "Retrain the bundled baseline classifier"
run = "uv run shield-engine train --data packages/engine/data/seed/train.jsonl"

# --- gate ------------------------------------------------------------------------

[tasks.check]
description = "Everything CI runs. Must pass before pushing."
depends = ["lint", "typecheck", "test", "spec:check", "contract:check", "secrets:scan", "sast"]

[tasks."build:web"]
description = "Production build of the web client"
dir = "apps/web"
run = "bun run build"
