[project]
name = "shield-api"
version = "0.2.0"
description = "Demo gateway that exposes the AI S.H.I.E.L.D. engine to the web client over HTTP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "shield-engine[groq]",
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.15.0",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
shield-api-export-openapi = "shield_api.openapi:main"

[dependency-groups]
# httpx2 (pydantic/httpx2) is the HTTP client starlette.testclient now expects.
dev = ["httpx2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shield_api"]

[tool.uv.sources]
shield-engine = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "spec(id): links a test to an acceptance criterion in specs/ (traceability)",
]
