# The CI gate. Every job runs the same mise task a developer runs locally,
# so "green locally" and "green in CI" mean the same thing.
# Branch protection needs only one required check: "CI OK".
# A pull request runs only the jobs for the parts that it changes (scripts/affected.sh).
# All other events run every job. Do not use `paths:` here: a workflow that does not
# start leaves the required check pending.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      web: ${{ steps.affected.outputs.web }}
      python: ${{ steps.affected.outputs.python }}
      database: ${{ steps.affected.outputs.database }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out a merge commit; its first parent is the base.
          fetch-depth: 2
          persist-credentials: false
      - name: Find the affected parts
        id: affected
        env:
          EVENT: ${{ github.event_name }}
        run: |
          for part in web python database; do
            affected=true
            if [ "$EVENT" = "pull_request" ]; then
              status=0
              scripts/affected.sh "ci-$part" HEAD^1 || status=$?
              case "$status" in
                0) ;;
                1) affected=false ;;
                *) exit "$status" ;;
              esac
            fi
            echo "$part=$affected" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          done

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: ${{ needs.changes.outputs.python }}
          javascript: ${{ needs.changes.outputs.web }}
      - if: needs.changes.outputs.python == 'true'
        run: mise run lint:py
      - if: needs.changes.outputs.web == 'true'
        run: mise run lint:web

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: ${{ needs.changes.outputs.python }}
          javascript: ${{ needs.changes.outputs.web }}
      - if: needs.changes.outputs.python == 'true'
        run: mise run typecheck:py
      - if: needs.changes.outputs.web == 'true'
        run: mise run typecheck:web

  test-python:
    name: Test (Python)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          javascript: "false"
      - run: mise run test:engine
      - run: mise run test:api

  test-web:
    name: Test (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "false"
      - run: mise run test:web

  # Always runs: these checks read specs, docs and other files in the whole repository.
  spec-contract:
    name: Specs and contract
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONTRACT: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          javascript: ${{ env.CONTRACT }}
      - name: Repository tooling tests
        run: mise run test:tooling
      - name: Every accepted criterion has a test
        run: mise run spec:check
      - name: Committed contract and generated types are current
        if: env.CONTRACT == 'true'
        run: mise run contract:check

  build-web:
    name: Build (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "false"
      - run: mise run build:web

  migrations:
    name: Migrations
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: supabase uv python
          javascript: "false"
      - name: Every migration applies to a fresh database
        run: mise run db:check
      # pgTAP and the Python database tests (spec 0056).
      - name: Database tests
        run: mise run test:db

  # The security jobs always run: a secret can be in any file.
  workflows:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: actionlint zizmor shellcheck
          python: "false"
          javascript: "false"
      - run: mise run lint:actions

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: gitleaks
          python: "false"
          javascript: "false"
      - run: mise run secrets:scan

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: uv python semgrep
          python: "false"
          javascript: "false"
      - run: mise run sast

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # A skipped job is a pass. A failed "changes" job is a failure, so a broken filter
  # cannot skip the gate.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - changes
      - lint
      - typecheck
      - test-python
      - test-web
      - spec-contract
      - build-web
      - migrations
      - workflows
      - secrets
      - sast
      - dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
