name: Bug report
description: Something behaves differently from its spec or docs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security vulnerabilities and detection bypasses: do not file here.** See SECURITY.md."
  - type: input
    id: component
    attributes: { label: Component, placeholder: "engine / api / web" }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: Minimal prompt, request or code. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual, description: Cite the spec criterion ID if you know it. }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version / commit }
