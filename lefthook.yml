# Git hooks. `mise run setup` installs them (lefthook install).
#   pre-commit  fast checks on staged files only; fixes are restaged
#   commit-msg  Conventional Commits subject line
#   pre-push    no direct pushes to main, the full CI gate (mise run check), then the browser tests
# Bypass for one command: LEFTHOOK=0 git push. CI runs the same checks anyway, except the
# browser tests: only this hook runs them.

min_version: 2.2.2

output:
  - summary
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: secrets
      run: gitleaks git --pre-commit --staged --redact --no-banner

    - name: whitespace
      run: git diff --cached --check -- . ':(exclude)*.md'

    - name: ruff
      glob: "*.{py,pyi}"
      stage_fixed: true
      run: uv run ruff check --fix --force-exclude {staged_files} && uv run ruff format --force-exclude {staged_files}

    - name: eslint
      root: apps/web/
      glob: "*.{ts,mts,js,mjs,vue}"
      exclude:
        - apps/web/app/types/api.gen.ts
      stage_fixed: true
      run: bunx eslint --fix --no-warn-ignored {staged_files}

    - name: workflows
      glob: ".github/**/*.{yml,yaml}"
      run: mise run lint:actions

    - name: sast
      glob: "*.{py,pyi,ts,mts,js,mjs,vue}"
      exclude:
        - apps/web/app/types/api.gen.ts
        - "**/tests/**"
        - apps/web/test/**
      run: semgrep scan --error --metrics=off --quiet --config p/python --config p/typescript --config p/owasp-top-ten {staged_files}

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        subject="$(head -n1 {1})"
        pattern='^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+|Merge .+|Revert .+|(fixup|squash|amend)! .+)$'
        if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
          echo "Commit subject is not a Conventional Commit: $subject"
          echo "Example: feat(engine): add canary token check"
          exit 1
        fi

pre-push:
  piped: true
  jobs:
    - name: protect-main
      use_stdin: true
      run: |
        while read -r _local_ref _local_sha remote_ref _remote_sha; do
          if [ "$remote_ref" = "refs/heads/main" ]; then
            echo "Direct pushes to main are blocked. Push a branch and open a PR."
            exit 1
          fi
        done

    - name: full-gate
      run: mise run check

    # Local only (Docker + local Supabase). CI does not run these tests yet.
    - name: e2e
      glob: "{apps,packages,supabase,contracts}/**"
      exclude:
        - "**/*.md"
      run: mise run e2e:gate
