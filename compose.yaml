# Runs the demo as containers: `mise run up` (or `docker compose up --build`).
#   web  http://localhost:3000
#   api  http://localhost:8000/api/v1/health
#   (Swagger UI at /api/v1/docs only with APP_ENV=development: `APP_ENV=development mise run up`)
#
# Data: SQLite in the `shield-data` volume by default. To use Supabase,
# set SUPABASE_URL and SUPABASE_KEY in apps/api/.env. For the local Supabase
# stack (`mise run db:start`), use SUPABASE_URL=http://host.docker.internal:54321.

name: ai-shield

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://[::1]:3000,http://[::]:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      - shield-data:/app/var
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Read by the browser, so it must be the API address as seen from the host.
      NUXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  shield-data:
