# Runs the demo as containers: `mise run up` starts local Supabase first, then
# runs `docker compose up --build` with SUPABASE_URL / SUPABASE_KEY injected.
#   web  http://localhost:3000
#   api  http://localhost:8000/api/v1/health
#   (APP_ENV defaults to development here: Swagger UI on, rate limits and BotID off.
#    Production runs on Vercel with APP_ENV=production; `APP_ENV=production mise run up` to try it.)

name: ai-shield

services:
  redis:
    image: redis:7-alpine
    ports:
      # Loopback only: Redis has no password in local development (spec 0054).
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://[::1]:3000,http://[::]:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Server-side proxy target (spec 0041); the browser only talks to web.
      NUXT_API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
